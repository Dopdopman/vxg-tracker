[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vxg-worker"
version = "0.1.0"
description = "Dedicated scraper, validator, and audit telemetry worker for vxg-tracker"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4.0",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "numpy>=2.1.0",
    "playwright>=1.49.0",
    "scikit-learn>=1.6.0",
    "selectolax>=0.3.26",
    "tenacity>=9.0.0",
    "vxg-shared",
]

[tool.setuptools.packages.find]
where = ["src"]

