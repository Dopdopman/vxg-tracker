[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vxg-shared"
version = "0.1.0"
description = "Shared ORM models, Alembic migrations, timezone and hashing utilities for vxg-tracker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2024.2",
]

[tool.setuptools.packages.find]
where = ["src"]

