services:
  - type: web
    name: vxg-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: WORKER_DISPATCH_MODE
        value: github_actions
      - key: GITHUB_WORKFLOW_FILE
        value: crawl-schedule.yml
      - key: GITHUB_WORKFLOW_REF
        value: main
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_DISPATCH_TOKEN
        sync: false

